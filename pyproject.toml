[project]
name = "callsite-impact"
version = "0.1.0"
description = "Which client call sites does an OpenAPI change actually break? The TypeScript compiler answers; this tool predicts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callsite_impact"]

# Without this marker the package installs as untyped, and mypy silently downgrades every
# intra-package import to `Any` -- so a strict type check passes while checking almost nothing.
[tool.hatch.build.targets.wheel.force-include]
"src/callsite_impact/py.typed" = "callsite_impact/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=callsite_impact --cov-report=term-missing:skip-covered -q"
markers = [
    "corpus: needs the vendored corpus on disk",
    "node: needs the TypeScript harness and npm",
]
